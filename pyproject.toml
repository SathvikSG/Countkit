[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "countkit"
version = "0.1.0"
description = "Count bacterial colonies and cells in images. Get a CSV and overlay pictures you can check."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Sathvik Sai Guntha", email = "sathvik.guntha@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.26",
    "opencv-python-headless>=4.8",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
cells = ["cellpose>=3.0"]
detect = ["ultralytics>=8.3"]
review = ["streamlit>=1.30", "streamlit-image-coordinates>=0.1.6", "pillow>=10"]
dev = ["pytest>=7"]

[project.scripts]
countkit = "countkit.cli:main"

[tool.setuptools]
packages = ["countkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
